version: 2

sources:
- name: raw_wsi_metadata
  tables:
    - name: svs_metadata
    - name: dataset_metadata
    - name: source_to_concept_map

models:
  - name: person
    description: "Table containing demographic information about each person in the database."
    columns:
      - name: person_id
        description: "A unique identifier for each person."
        tests:
          - not_null
          - unique

      - name: gender_concept_id
        description: "Concept ID representing the gender of the person."

      - name: year_of_birth
        description: "Year the person was born."

      - name: month_of_birth
        description: "Month the person was born."

      - name: day_of_birth
        description: "Day the person was born."

      - name: birth_datetime
        description: "Exact date and time of birth for the person."

      - name: race_concept_id
        description: "Concept ID representing the race of the person."

      - name: race_source_value
        description: "Source value representing the race of the person."

      - name: ethnicity_concept_id
        description: "Concept ID representing the ethnicity of the person."

      - name: ethnicity_source_value
        description: "Source value representing the ethnicity of the person."

      - name: location_id
        description: "Foreign key to the location where the person resides."

      - name: provider_id
        description: "Primary care provider assigned to the person."

      - name: care_site_id
        description: "Foreign key to the care site where the person receives primary care."

      - name: person_source_value
        description: "An external identifier for the person, from the source data."
    
  - name: care_site
    description: "Table containing information about care sites (e.g., hospitals, clinics) within the healthcare system."
    columns:
      - name: care_site_id
        description: "A unique identifier for each care site."
        tests:
          - not_null
          - unique

      - name: care_site_name
        description: "Name of the care site."
      
      - name: place_of_service_concept_id
        description: "Concept ID representing the type of place of service at the care site."

      - name: location_id
        description: "Foreign key to the location of the care site."
  
      - name: care_site_source_value
        description: "An external identifier for the care site, from the source data."
      
      - name: place_of_service_source_value
        description: "Place of service of the care_site as it appears in the source data."

  - name: condition_occurrence
    description: "Table containing data about medical conditions (diagnoses) associated with persons in the database."
    columns:
      - name: condition_occurrence_id
        description: "A unique identifier for each condition record for a person. Refer to the ETL process for handling of duplicate conditions within the same visit."
        tests:
          - not_null
          - unique

      - name: person_id
        description: "Foreign key to the person for whom the condition is recorded."

      - name: condition_concept_id
        description: "The standard concept ID representing the condition, mapped from the source value. Recommended for use in analyses and network studies."

      - name: condition_start_date
        description: "Date representing the start of the condition."
      
      - name: condition_start_datetime
        description: "Date and time representing the start of the condition. Set to midnight (00:00:0000) if not specified."

      - name: condition_end_date
        description: "Date representing the end of the condition. Use the same date as CONDITION_START_DATE if only one date is available in the source data."

      - name: condition_end_datetime
        description: "Date and time representing the end of the condition. Set to midnight (00:00:0000) if not specified."

      - name: condition_type_concept_id
        description: "Concept ID representing the provenance of the condition (e.g., from EHR, claims, registry)."

      - name: condition_status_concept_id
        description: "Concept representing the status of the condition (e.g., admitting diagnosis, final diagnosis, exclusionary diagnosis)."

      - name: stop_reason
        description: "Reason the condition is no longer valid, as specified in the source data. If not available, this field may be left blank."
        data_type: varchar(20)

      - name: provider_id
        description: "Foreign key to the provider associated with the condition record (e.g., diagnosing provider)."

      - name: visit_occurrence_id
        description: "Foreign key to the visit during which the condition occurred. This may need to be inferred based on dates in the source data."

      - name: visit_detail_id
        description: "Foreign key to the visit detail during which the condition occurred (e.g., ICU stay)."

      - name: condition_source_value
        description: "Original source value representing the condition (e.g., ICD10 or Read code)."

      - name: condition_source_concept_id
        description: "Concept ID representing the source value of the condition. Generally not recommended for analysis unless Standard Concepts are inadequate."

      - name: condition_status_source_value
        description: "Original source value representing the condition status, indicating timing or type of diagnosis (e.g., admitting or preliminary diagnosis)."

  - name: procedure_occurrence
    description: "Table containing data about procedures associated with persons in the database."
    columns:
      - name: procedure_occurrence_id
        description: "The unique key given to a procedure record for a person. Each instance of a procedure occurrence in the source data should be assigned this unique key. Duplicate procedures during the same visit can be kept with individual PROCEDURE_OCCURRENCE_IDs as per ETL logic."

      - name: person_id
        description: "The PERSON_ID of the PERSON for whom the procedure is recorded. This may be a system-generated code."

      - name: procedure_concept_id
        description: "The standard concept mapped from the source value representing a procedure. This field is recommended for primary use in analyses and network studies."

      - name: procedure_date
        description: "The date the procedure started. It is meant to be the start date of the procedure."

      - name: procedure_datetime
        description: "If the procedure has a start time in the source data, this field houses that information."

      - name: procedure_end_date
        description: "The date the procedure ended. For most cases, this will be the same as the procedure start date."

      - name: procedure_end_datetime
        description: "The datetime that the procedure ended, often used in conjunction with procedure_start_datetime to determine the length of the procedure."

      - name: procedure_type_concept_id
        description: "Concept ID representing the provenance of the Procedure record, such as EHR, insurance claim, or registry."

      - name: modifier_concept_id
        description: "Modifier concepts providing additional information about the procedure, typically distinguished by 'Modifier' concept classes."

      - name: quantity
        description: "Indicates the quantity of the procedure. If omitted, a single procedure is assumed. If quantity is '0' in the source, this should default to '1' in the ETL."

      - name: provider_id
        description: "The provider associated with the procedure record, for example, the provider who performed the procedure."

      - name: visit_occurrence_id
        description: "The visit during which the procedure occurred. May be inferred based on dates if not explicitly provided."

      - name: visit_detail_id
        description: "The VISIT_DETAIL record during which the procedure occurred, for example, an ICU stay within an overall hospital visit."

      - name: procedure_source_value
        description: "The verbatim source value representing the procedure, such as a CPT4 or OPCS4 code."

      - name: procedure_source_concept_id
        description: "Concept ID representing the procedure source value, not necessarily a standard concept. Use in analyses is discouraged."

      - name: modifier_source_value
        description: "The verbatim source value representing the modifier code for the procedure, mapped to a MODIFIER_CONCEPT_ID."

  - name: observation
    description: "Table containing observation records associated with persons in the database."
    columns:
      - name: observation_id
        description: "The unique key given to an observation record for a person. Each instance of an observation present in the source data should be assigned this unique key."

      - name: person_id
        description: "The PERSON_ID of the person for whom the observation is recorded. This may be a system-generated code."

      - name: observation_concept_id
        description: "The standard concept mapped from the source value representing the observation. Recommended for primary use in analyses."

      - name: observation_date
        description: "The date when the observation was obtained, which could represent various observation types, such as lab tests or patient family history."

      - name: observation_datetime
        description: "If no time is given, this is set to midnight (00:00:00)."

      - name: observation_type_concept_id
        description: "Concept ID used to determine the provenance of the observation, such as EHR, insurance claim, or registry."

      - name: value_as_number
        description: "The numerical value of the observation result, if applicable and available."

      - name: value_as_string
        description: "The categorical value of the observation result, if applicable and available."

      - name: value_as_concept_id
        description: "The concept ID representing the categorical result of the observation if applicable. This can represent a specific clinical detail derived from a source concept."

      - name: qualifier_concept_id
        description: "Concept ID for any attributes specifying additional details about the observation, such as degrees or severities."

      - name: unit_concept_id
        description: "Concept ID representing the unit of measurement for the observation, mapped from the source unit."

      - name: provider_id
        description: "The provider associated with the observation record, such as the provider who ordered the test or recorded the result."

      - name: visit_occurrence_id
        description: "The visit during which the observation occurred. This may need to be determined based on dates in the source data."

      - name: visit_detail_id
        description: "The VISIT_DETAIL record during which the observation occurred, such as an ICU stay within an overall hospital visit."

      - name: observation_source_value
        description: "The verbatim source value representing the observation, such as an ICD10 or Read code."

      - name: observation_source_concept_id
        description: "The concept ID representing the observation source value, which may not necessarily be a standard concept."

      - name: unit_source_value
        description: "The verbatim source value representing the unit of measurement for the observation."

      - name: qualifier_source_value
        description: "The verbatim source value representing the qualifier of the observation, such as an indicator of severity."

      - name: value_source_value
        description: "The verbatim result value of the observation from the source data. This field captures the observation result if the observation itself requires a result."

      - name: observation_event_id
        description: "If the observation is related to another record, this field is the primary key of the linked record."

      - name: obs_event_field_concept_id
        description: "The concept ID that identifies the table and field from which the observation_event_id originated."
  
  
  - name: image_occurrence
    description: "Table representing image occurrences in the Common Data Model (CDM)."
    columns:
      - name: image_occurrence_id
        description: "This field represents the unique identifier for each image."
        data_type: varchar(50)
        tests:
          - not_null
      - name: visit_detail_id
        description: "The Visit Detail during which the device was prescribed or given."
        data_type: integer
      - name: person_id
        description: "This field represents the unique identifier for the patient associated with the image."
        data_type: varchar(50)
      - name: study_id
        description: "This field represents the unique identifier for the imaging study."
        data_type: varchar(50)
      - name: modality
        description: "This field represents the imaging modality used (e.g., MRI, CT, X-ray)."
        data_type: varchar(50)
      - name: body_part_examined
        description: "This field represents the body part examined in the imaging study."
        data_type: varchar(50)
      - name: date_of_image
        description: "This field represents the date when the imaging study was performed."
        data_type: date
      - name: file_name
        description: "This field represents the name of the image file in the storage system."
        data_type: varchar(255)

  - name: image_feature
    description: "Table representing features extracted from images in the CDM."
    columns:
      - name: image_feature_id
        description: "This field represents the unique identifier for the image feature."
        data_type: varchar(50)
        tests:
          - not_null
      - name: visit_detail_id
        description: "The Visit Detail during which the device was prescribed or given."
        data_type: integer
      - name: feature_type
        description: "This field represents the type of extracted feature (e.g., shape, texture, intensity)."
        data_type: varchar(50)
      - name: extraction_method
        description: "This field represents the method or algorithm used to extract the feature."
        data_type: varchar(50)
      - name: date_of_extraction
        description: "This field represents the date when the feature was extracted from the image."
        data_type: date
      - name: feature_source_value
        description: "This field contains the raw or original value of the feature extracted from the image, as provided by the imaging software."
        data_type: varchar(50)
      - name: feature_concept_id
        description: "This identifier links the extracted feature to a standardized concept in the ontology."
        data_type: integer
      - name: unit_source_value
        description: "This field represents the unit of measurement for the feature source value."
        data_type: varchar(50)
      - name: unit_concept_id
        description: "This identifier links the unit of measurement to a standardized unit concept."
        data_type: integer
      - name: downsample_level
        description: "This field indicates the level of downsampling applied to the image data, which may affect the resolution and detail available in the extracted features."
        data_type: float
      - name: feature_source_concept_id
        description: "Refers to the original source of the feature. All image features present in metadata will be mapped to feature_source_value (earlier feature_value) and will be assigned a feature_concept_id."
        data_type: integer
      - name: extraction_date
        description: "This field represents the date when the feature was extracted from the image."
        data_type: date
      - name: extraction_time
        description: "This field captures the time at which the feature extraction occurred."
        data_type: time
      - name: extraction_datetime
        description: "This field combines both the extraction date and time into a single timestamp."
        data_type: timestamp
      - name: extraction_timezone
        description: "This field combines the extraction timezone."
        data_type: varchar(50)
      - name: description
        description: "This field contains a narrative or detailed description of the feature, providing context or additional information that may be useful for interpretation."
        data_type: varchar(50)

  - name: device_exposure
    description: "Table representing device exposures in the CDM."
    columns:
      - name: device_exposure_id
        description: "The unique key given to records a person's exposure to a foreign physical object or instrument."
        data_type: integer
        tests:
          - not_null
      - name: person_id
        description: "Unique identifier for the person exposed to the device."
        data_type: integer
      - name: device_concept_id
        description: "The DEVICE_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source concept id which represents a foreign object or instrument the person was exposed to."
        data_type: integer
      - name: device_exposure_start_date
        description: "Use this date to determine the start date of the device record."
        data_type: date
      - name: device_exposure_start_datetime
        description: "The start date and time of the device exposure."
        data_type: timestamp
      - name: device_exposure_end_date
        description: "The DEVICE_EXPOSURE_END_DATE denotes the day the device exposure ended for the patient, if given."
        data_type: date
      - name: device_exposure_end_datetime
        description: "The end date and time of the device exposure."
        data_type: timestamp
      - name: device_type_concept_id
        description: "You can use the TYPE_CONCEPT_ID to denote the provenance of the record, as in whether the record is from administrative claims or EHR."
        data_type: integer
      - name: unique_device_id
        description: "This is the Unique Device Identification (UDI-DI) number for devices regulated by the FDA, if given."
        data_type: varchar(255)
      - name: production_id
        description: "This is the Production Identifier (UDI-PI) portion of the Unique Device Identification."
        data_type: varchar(255)
      - name: quantity
        description: "Quantity of the device used or administered."
        data_type: integer
      - name: provider_id
        description: "The Provider associated with device record, e.g., the provider who wrote the prescription or the provider who implanted the device."
        data_type: integer
      - name: visit_occurrence_id
        description: "The Visit during which the device was prescribed or given."
        data_type: integer
      - name: visit_detail_id
        description: "The Visit Detail during which the device was prescribed or given."
        data_type: integer
      - name: device_source_value
        description: "This field houses the verbatim value from the source data representing the device exposure that occurred. For example, this could be an NDC or Gemscript code."
        data_type: varchar(50)
      - name: device_source_concept_id
        description: "This is the concept representing the device source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Device necessary for a given analytic use case. Consider using DEVICE_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network."
        data_type: integer
      - name: unit_concept_id
        description: "UNIT_SOURCE_VALUES should be mapped to a Standard Concept in the Unit domain that best represents the unit as given in the source data."
        data_type: integer
      - name: unit_source_value
        description: "This field houses the verbatim value from the source data representing the unit of the Device. For example, blood transfusions are considered devices and can be given in mL quantities."
        data_type: varchar(50)
      - name: unit_source_concept_id
        description: "This is the concept representing the UNIT_SOURCE_VALUE and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Unit necessary for a given analytic use case. Consider using UNIT_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network."
        data_type: integer